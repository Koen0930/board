<style>

  :root { color-scheme: dark; --fg: #f3f4f8; --fg-2: #b4b9c9; --line: rgba(255, 255, 255, .14); --bad: #f59a9a; }
  * { box-sizing: border-box; }
  body {

  }
  form { width: min(100%, 24rem); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(8px); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }

  p { margin: 0; color: var(--fg-2); font-size: 13px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--fg-2); }
  input[type="password"] { font: inherit; color: var(--fg); background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
  input[type="password"]:focus-visible, button:focus-visible { outline: 2px solid #8fb9f2; outline-offset: 2px; }
  .check { flex-direction: row; align-items: center; gap: 8px; }
  button { font: inherit; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2a78d6, #6250d6); border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: progress; }
  #msg { color: var(--bad); min-height: 1.7em; }
  [hidden] { display: none !important; }

  const stored = {
    get: () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set: (v) => { try { localStorage.setItem(KEY, v); } catch (e) { /* 覚えられなくても開ける */ } },
    del: () => { try { localStorage.removeItem(KEY); } catch (e) { /* 何もしない */ } },
  };

  // 合言葉から鍵を作り（PBKDF2-HMAC-SHA256）、AES-256-GCM で開く。合言葉が違えば、ここで失敗する
  const open = async (pass) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iter },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.ct));
    return new TextDecoder().decode(plain);
  };
  const show = (html) => {
    document.open();
    document.write(html);
    document.close();
  };
  const ask = (text) => {
    form.hidden = false;
    msg.textContent = text || '';
    go.disabled = false;
    document.getElementById('pass').focus();
  };

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const pass = document.getElementById('pass').value.trim();
    if (!pass) return;
    go.disabled = true;
    msg.textContent = '';
    try {
      const html = await open(pass);
      if (document.getElementById('keep').checked) stored.set(pass);
      show(html);
    } catch (e) {
      ask('合言葉が違います。');
    }
  });

  (async () => {
    if (!payload || !payload.ct) return ask('ページの中身がありません。');
    if (!window.crypto || !crypto.subtle) return ask('このブラウザでは開けません（https で開いてください）。');
    // 配られた URL の # のあとに合言葉が付いていれば、それで開く。# 以降はサーバーに送られない。
    // 開けたら端末に覚え、URL から消す
    let fromUrl = '';
    try { fromUrl = decodeURIComponent(location.hash.slice(1)).trim(); } catch (e) { fromUrl = ''; }
    for (const pass of [fromUrl, stored.get()]) {
      if (!pass) continue;
      try {
        const html = await open(pass);
        stored.set(pass);
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
        return show(html);
      } catch (e) {
        if (pass !== fromUrl) stored.del();
      }
    }
    ask(fromUrl ? 'URL に付いている合言葉が違います。' : '');
  })();
})();
</script>
</body>
</html>
